name: gym_app
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_screenutil: ^5.9.3
  smooth_page_indicator: ^1.2.1
  go_router: ^17.0.0
  shared_preferences: ^2.5.3
  flutter_localization: ^0.3.3
  flutter_localizations:
    sdk: flutter
  flutter_bloc: ^9.1.1
  bloc: ^9.1.0
  meta: ^1.16.0
  equatable: ^2.0.7
  intl: ^0.20.2
  intl_utils: ^2.8.13
  flutter_svg: ^2.2.3
  flutter_rating_bar: ^4.0.1
  fl_chart: ^1.1.1
  font_awesome_flutter: ^10.12.0
  health: ^12.2.0
  permission_handler: ^11.3.1
  dart_openai: ^6.1.1
  http: ^1.6.0
  easy_stepper: ^1.0.1
  sleek_circular_slider: ^2.1.0
  pdf: ^3.10.8
  printing: ^5.13.0
  sign_in_with_apple: ^6.1.2
  google_sign_in: ^6.2.2
  auto_size_text: ^3.0.0
  google_generative_ai: ^0.4.6
  qr_flutter: ^4.1.0
  webview_flutter: ^4.10.0
  confetti: ^0.7.0
  image_picker: ^1.1.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter:

  uses-material-design: true

  assets:
    - assets/images/



flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/FitQuad.png"
  adaptive_icon_background: "#1E0A35"
  adaptive_icon_foreground: "assets/images/FitQuad.png"
  web:
    generate: false
  macos:
    generate: true
    image_path: "assets/images/FitQuad.png"

flutter_native_splash:
  color: "#FFFFFF"
  image: null
flutter_intl:
  enabled: true